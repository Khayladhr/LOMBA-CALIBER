<!DOCTYPE html>
<html lang="en">

<head>
    <meta chrset="UTF-8">
    <title>Intelix - Manufacturing Intelligence Dashboard</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Manrope:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600;700&display=swap');

        :root {
            --alice-blue: #DAE8FB;
            --thistle: #F2D2FF;
            --pearl-aqua: #75CBD1;
            --dusk-blue: #3E5BA3;
            --deep-navy: #0C0D45;
            --bg: #F2F6FC;
            --panel: #FFFFFF;
            --panel-2: #E9F0FA;
            --panel-3: #DCE7F6;
            --border: #D3E0F1;
            --border-soft: #E4ECF8;
            --text: var(--deep-navy);
            --text-dim: #4E5578;
            --text-faint: #8A92B0;
            --accent: var(--dusk-blue);
            --accent-soft: #E3E9F7;
            --accent-deep: #2C4179;
            --success: #3E9B90;
            --success-soft: #E2F3F1;
            --warning: #C98A3B;
            --warning-soft: #FBEFE0;
            --critical: #C15757;
            --critical-soft: #F8E6E6;
            --ai-tint: var(--thistle);
            --ai-text: #7A4C99;
            --ai-soft: #F7ECFC;
            --sidebar: var(--deep-navy);
            --sidebar-2: #17194F;
            --sidebar-border: #2A2C63;
            --sidebar-text: #C7CCE8;
            --sidebar-text-dim: #7E84AC;
            --sans: 'Manrope', sans-serif;
            --display: 'Fraunces', serif;
            --mono: 'JetBrains Mono', monospace;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background: var(--bg);
            color: var(--text);
            font-family: var(--sans);
            font-size: 14px;
            -webkit-font-smoothing: antialiased;
        }

        .app {
            display: grid;
            grid-template-columns: 240px 1fr;
            min-height: 100vh;
        }

        .sidebar {
            background: var(--sidebar);
            color: var(--sidebar-text);
            display: flex;
            flex-direction: column;
            padding: 22px 14px;
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 4px 8px 20px 8px;
            border-bottom: 1px solid var(--sidebar-border);
            margin-bottom: 16px;
        }

        .brand-mark {
            width: 32px;
            height: 32px;
            border-radius: 9px;
            background: linear-gradient(135deg, var(--pearl-aqua), var(--dusk-blue));
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: var(--display);
            font-weight: 600;
            font-size: 16px;
            color: #0C0D45;
            flex-shrink: 0;
        }

        .brand-name {
            font-family: var(--display);
            font-weight: 600;
            font-size: 17px;
            color: #fff;
        }

        .brand-sub {
            font-size: 10.5px;
            color: var(--sidebar-text-dim);
            margin-top: 1px;
        }

        .nav-selection-label {
            font-size: 10.5px;
            color: var(--sidebar-text-dim);
            text-transform: uppercase;
            letter-spacing: 0.07em;
            padding: 14px 10px 8px 10px;
        }

        .nav-item {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 9px 10px;
            border-radius: 8px;
            color: var(--sidebar-text-dim);
            cursor: pointer;
            font-size: 13.5px;
            font-weight: 500;
            transition: background .12s, color .12s;
            position: relative;

        }

        .nav-item svg {
            width: 16px;
            height: 16px;
            flex-shrink: 0;
            opacity: .85;
        }

        .nav-item:hover {
            background: var(--sidebar-2);
            color: #fff;
        }

        .nav-item.active {
            background: var(--sidebar-2);
            color: #fff;
        }

        .nav-item.active::before {
            content: "";
            position: absolute;
            top: 0;
            left: -14px;
            right: 8px;
            bottom: 8px;
            background: var(--pearl-aqua);
            border-radius: 2px;
        }

        .nav-badge {
            margin-left: auto;
            font-family: var(--mono);
            font-size: 10.5px;
            background: var(--critical);
            color: #fff;
            padding: 1px 6px;
            border-radius: 20px;
            font-weight: 600;
        }

        .sidebar-footer {
            margin-top: auto;
            padding: 12px 10px;
            border-top: 1px solid var(--sidebar-border);
            display: flex;
            align-items: center;
            gap: 9px;
        }

        .avatar {
            width: 28px;
            height: 28px;
            border-radius: 50%;
            background: var(--sidebar-2);
            border: 1px solid var(--sidebar-border);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 11px;
            font-weight: 700;
            color: #fff;
        }

        .sidebar-footer .name {
            font-size: 12.5px;
            font-weight: 600;
            color: #fff;
        }

        .sidebar-footer .role {
            font-size: 10.5px;
            color: var(--sidebar-text-dim);
        }

        .main {
            display: flex;
            flex-direction: column;
            min-width: 0;
        }

        .topbar {
            height: 60px;
            border-bottom: 1px solid var(--border);
            display: flex;
            align-items: center;
            padding: 0 26px;
            gap: 16px;
            background: var(--panel);
        }

        .plant-select {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 12.5px;
            color: var(--text-dim);
            background: var(--accent-soft);
            border: 1px solid var(--border);
            padding: 6px 12px;
            border-radius: 20px;
            font-weight: 600;
        }

        .plant-select .dot {
            width: 6px;
            height: 6px;
            border-radius: 50%;
            background: var(--success);
        }

        .topbar-search {
            flex: 1;
            max-width: 420px;
            display: flex;
            align-items: center;
            gap: 8px;
            background: var(--panel-2);
            border: 1px solid var(--border);
            border-radius: 20px;
            padding: 8px 14px;
            color: var(--text-faint);
            font-size: 13px;
        }

        .topbar-right {
            margin-left: auto;
            display: flex;
            align-items: center;
            gap: 14px;
        }

        .icon-btn {
            width: 34px;
            height: 34px;
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: var(--panel-2);
            border: 1px solid var(--border);
            color: var(--text-dim);
            position: relative;
            cursor: pointer;
        }

        .icon-btn .dot {
            position: absolute;
            top: 6px;
            right: 6px;
            width: 6px;
            height: 6px;
            border-radius: 50%;
            background: var(--critical);
        }

        .content {
            padding: 26px 30px 60px 30px;
            overflow-y: auto;
        }

        .page {
            display: none;
        }

        .page.active {
            display: block;
        }

        .page-head {
            display: flex;
            align-items: baseline;
            justify-content: space-between;
            margin-bottom: 20px;
        }

        .page-title {
            font-family: var(--display);
            font-size: 24px;
            font-weight: 600;
        }

        .page-sub {
            color: var(--text-faint);
            font-size: 12.5px;
            margin-top: 4px;
        }

        .btn {
            font-family: var(--sans);
            font-weight: 700;
            font-size: 12.5px;
            background: var(--accent);
            color: #fff;
            border: none;
            padding: 10px 18px;
            border-radius: 9px;
            cursor: pointer;
        }

        .btn.secondary {
            background: var(--panel);
            color: var(--text);
            border: 1px solid var(--border);
        }

        /* ============================================================
     6. KARTU KPI — 4 kotak angka ringkasan di halaman Overview
     ============================================================ */
        .kpi-row {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 14px;
            margin-bottom: 22px;
        }

        .kpi-card {
            background: var(--panel);
            border: 1px solid var(--border);
            border-radius: 14px;
            padding: 17px 19px;
        }

        .kpi-label {
            font-size: 11.5px;
            color: var(--text-faint);
            text-transform: uppercase;
            letter-spacing: 0.05em;
            margin-bottom: 10px;
            font-weight: 700;
        }

        .kpi-value {
            font-family: var(--display);
            font-size: 27px;
            font-weight: 600;
        }

        .kpi-value.critical {
            color: var(--critical);
        }

        .kpi-delta {
            font-size: 11.5px;
            margin-top: 7px;
            font-weight: 600;
        }

        .kpi-delta.up {
            color: var(--critical);
        }

        .kpi-delta.down {
            color: var(--success);
        }

        .grid-2 {
            display: grid;
            grid-template-columns: 1.4fr 1fr;
            gap: 16px;
            margin-bottom: 16px;
        }

        .panel {
            background: var(--panel);
            border: 1px solid var(--border);
            border-radius: 14px;
            padding: 20px 22px;
        }

        .panel-head {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 15px;
        }

        .panel-title {
            font-weight: 700;
            font-size: 14.5px;
        }

        .panel-title-sub {
            font-size: 11px;
            color: var(--text-faint);
            margin-top: 2px;
        }

        .link {
            font-size: 12px;
            color: var(--accent-deep);
            cursor: pointer;
            font-weight: 700;
        }

        /* ---- Grid kotak status tiap equipment (PU-2101B, KO-3201, dst) ---- */
        .eq-grid {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: 10px;
        }

        .eq-tile {
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 13px 13px;
            background: var(--panel-2);
            cursor: pointer;
            transition: transform .1s;
        }

        .eq-tile:hover {
            transform: translateY(-2px);
            border-color: var(--accent);
        }

        .eq-tag {
            font-family: var(--mono);
            font-weight: 700;
            font-size: 13px;
        }

        .eq-name {
            font-size: 10.5px;
            color: var(--text-faint);
            margin-top: 2px;
            margin-bottom: 11px;
        }

        .status-pill {
            display: inline-flex;
            align-items: center;
            gap: 5px;
            font-size: 10.5px;
            font-weight: 700;
            padding: 4px 9px;
            border-radius: 20px;
        }

        .status-pill .dot {
            width: 6px;
            height: 6px;
            border-radius: 50%;
        }

        .status-critical {
            background: var(--critical-soft);
            color: var(--critical);
        }

        .status-critical .dot {
            background: var(--critical);
        }

        .status-warning {
            background: var(--warning-soft);
            color: var(--warning);
        }

        .status-warning .dot {
            background: var(--warning);
        }

        .status-normal {
            background: var(--success-soft);
            color: var(--success);
        }

        .status-normal .dot {
            background: var(--success);
        }

        /* ---- Baris ranking "Top Bad Actors" pakai bar chart horizontal ---- */
        .bad-actor-row {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 10px 0;
            border-bottom: 1px solid var(--border-soft);
        }

        .bad-actor-row:last-child {
            border-bottom: none;
        }

        .ba-rank {
            font-family: var(--mono);
            color: var(--text-faint);
            font-size: 12px;
            width: 16px;
        }

        .ba-bar-wrap {
            flex: 1;
            height: 7px;
            background: var(--panel-3);
            border-radius: 4px;
            overflow: hidden;
        }

        .ba-bar {
            height: 100%;
            background: linear-gradient(90deg, var(--warning), var(--critical));
        }

        .ba-tag {
            font-family: var(--mono);
            font-size: 12px;
            width: 80px;
            font-weight: 600;
        }

        .ba-val {
            font-family: var(--mono);
            font-size: 12px;
            color: var(--text-dim);
            width: 64px;
            text-align: right;
        }

        /* ============================================================
     7. TABEL — dipakai di Problem Tank, Action Tracker, RCA Report
     ============================================================ */
        .table {
            width: 100%;
            border-collapse: collapse;
        }

        .table th {
            text-align: left;
            font-size: 10.5px;
            text-transform: uppercase;
            letter-spacing: .05em;
            color: var(--text-faint);
            padding: 0 12px 10px 12px;
            border-bottom: 2px solid var(--border);
            font-weight: 700;
        }

        .table td {
            padding: 14px 12px;
            border-bottom: 1px solid var(--border-soft);
            font-size: 13px;
            vertical-align: middle;
        }

        .table tr:hover td {
            background: var(--panel-2);
            cursor: pointer;
        }

        .priority-badge {
            font-size: 11px;
            font-weight: 800;
            padding: 4px 10px;
            border-radius: 20px;
            display: inline-block;
        }

        .p-critical {
            background: var(--critical-soft);
            color: var(--critical);
        }

        .p-high {
            background: var(--warning-soft);
            color: var(--warning);
        }

        .p-medium {
            background: var(--accent-soft);
            color: var(--accent-deep);
        }

        .risk-score {
            font-family: var(--mono);
            font-weight: 700;
        }

        .eq-cell {
            font-family: var(--mono);
            font-weight: 700;
        }

        .tag-pill {
            font-size: 11px;
            background: var(--panel-2);
            border: 1px solid var(--border);
            padding: 3px 9px;
            border-radius: 20px;
            color: var(--text-dim);
            font-weight: 600;
        }

        /* ============================================================
     8. DETECTION PIPELINE — 4 kotak berurutan yang menggambarkan
        alur data (Production Data → Equipment Performance →
        Incident Database → RCA Report)
     ============================================================ */
        .pipeline {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 0;
            position: relative;
            margin: 6px 0 8px 0;
        }

        .pipe-stage {
            background: var(--panel);
            border: 2px solid var(--border);
            border-radius: 16px;
            padding: 20px 18px;
            position: relative;
            z-index: 2;
        }

        .pipe-stage.active {
            border-color: var(--accent);
            box-shadow: 0 6px 18px -8px rgba(62, 91, 163, 0.35);
        }

        .pipe-num {
            width: 26px;
            height: 26px;
            border-radius: 50%;
            background: var(--deep-navy);
            color: #fff;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: var(--mono);
            font-size: 12px;
            font-weight: 700;
            margin-bottom: 12px;
        }

        .pipe-stage.active .pipe-num {
            background: var(--accent);
        }

        .pipe-label {
            font-size: 10.5px;
            text-transform: uppercase;
            letter-spacing: .05em;
            color: var(--text-faint);
            font-weight: 700;
            margin-bottom: 4px;
        }

        .pipe-title {
            font-weight: 700;
            font-size: 14px;
            margin-bottom: 10px;
        }

        .pipe-detail {
            font-size: 12px;
            color: var(--text-dim);
            line-height: 1.5;
        }

        .pipe-connector {
            position: absolute;
            top: 33px;
            left: 0;
            right: 0;
            height: 2px;
            background: var(--border);
            z-index: 1;
        }

        .pipe-metric {
            font-family: var(--mono);
            font-weight: 700;
            color: var(--critical);
        }

        /* ============================================================
     9. ROOT CAUSE EXPLORER — kolom kiri daftar alert, kolom kanan
        detail + hasil pencarian kemiripan dari AI 
     ============================================================ */
        .rc-layout {
            display: grid;
            grid-template-columns: 320px 1fr;
            gap: 16px;
        }

        .alert-list-item {
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 13px 15px;
            margin-bottom: 10px;
            cursor: pointer;
            background: var(--panel);
        }

        .alert-list-item.selected {
            border-color: var(--accent);
            background: var(--accent-soft);
        }

        .ali-top {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 6px;
        }

        .ali-desc {
            font-size: 12.5px;
            color: var(--text-dim);
            line-height: 1.4;
        }

        .confidence-ring {
            width: 66px;
            height: 66px;
            border-radius: 50%;
            background: conic-gradient(var(--accent) 0% 87%, var(--border) 87% 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
        }

        .confidence-ring-inner {
            width: 52px;
            height: 52px;
            border-radius: 50%;
            background: var(--panel);
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: var(--mono);
            font-weight: 700;
            font-size: 13px;
        }

        .match-card {
            border: 1px solid var(--border);
            border-radius: 14px;
            padding: 19px 21px;
            margin-bottom: 14px;
            background: var(--panel-2);
        }

        .match-header {
            display: flex;
            align-items: center;
            gap: 16px;
            margin-bottom: 14px;
        }

        .rca-source-tag {
            font-size: 11px;
            color: var(--text-faint);
            border: 1px solid var(--border);
            padding: 2px 9px;
            border-radius: 20px;
        }

        .kv-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px 20px;
            margin-top: 14px;
        }

        .kv-label {
            font-size: 10.5px;
            color: var(--text-faint);
            text-transform: uppercase;
            letter-spacing: .04em;
            margin-bottom: 3px;
            font-weight: 700;
        }

        .kv-value {
            font-size: 13px;
            line-height: 1.4;
        }

        .ai-badge {
            display: inline-flex;
            align-items: center;
            gap: 5px;
            font-size: 10.5px;
            font-weight: 700;
            color: var(--ai-text);
            background: var(--ai-soft);
            padding: 3px 10px;
            border-radius: 20px;
        }

        .chart-legend {
            display: flex;
            gap: 16px;
            margin-bottom: 10px;
        }

        .legend-item {
            display: flex;
            align-items: center;
            gap: 6px;
            font-size: 11.5px;
            color: var(--text-dim);
        }

        .legend-dot {
            width: 8px;
            height: 8px;
            border-radius: 2px;
        }

        .status-chip {
            font-size: 11px;
            padding: 4px 10px;
            border-radius: 20px;
            font-weight: 700;
        }

        .chip-open {
            background: var(--critical-soft);
            color: var(--critical);
        }

        .chip-progress {
            background: var(--warning-soft);
            color: var(--warning);
        }

        .chip-done {
            background: var(--success-soft);
            color: var(--success);
        }

        .avatar-sm {
            width: 22px;
            height: 22px;
            border-radius: 50%;
            background: var(--panel-2);
            border: 1px solid var(--border);
            display: inline-flex;
            align-items: center;
            justify-content: center;
            font-size: 9.5px;
            font-weight: 700;
            margin-right: 6px;
            vertical-align: middle;
        }

        .eq-detail-head {
            display: flex;
            align-items: center;
            gap: 14px;
            margin-bottom: 20px;
        }

        .eq-detail-icon {
            width: 48px;
            height: 48px;
            border-radius: 12px;
            background: var(--panel-2);
            border: 1px solid var(--border);
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: var(--mono);
            font-weight: 700;
        }

        .stat-strip {
            display: flex;
            gap: 28px;
            margin-top: 6px;
        }

        .stat-mini .l {
            font-size: 10.5px;
            color: var(--text-faint);
            font-weight: 600;
        }

        .stat-mini .v {
            font-family: var(--mono);
            font-size: 16px;
            font-weight: 700;
            margin-top: 3px;
        }

        .timeline {
            display: flex;
            gap: 4px;
            margin-top: 14px;
        }

        .tl-seg {
            flex: 1;
            height: 28px;
            border-radius: 6px;
        }

        .tl-normal {
            background: var(--success-soft);
            border: 1px solid var(--success);
        }

        .tl-alarm {
            background: var(--warning-soft);
            border: 1px solid var(--warning);
        }

        .tl-trip {
            background: var(--critical-soft);
            border: 1px solid var(--critical);
        }

        /* ============================================================
     10. HALAMAN RCA REPORT — meniru format dokumen resmi
     ============================================================ */
        .rca-doc-head {
            background: var(--deep-navy);
            border-radius: 16px;
            padding: 22px 26px;
            margin-bottom: 18px;
            color: #fff;
            position: relative;
            overflow: hidden;
        }

        .rca-doc-head::after {
            content: '';
            position: absolute;
            top: 0;
            right: 0;
            bottom: 0;
            width: 6px;
            background: var(--pearl-aqua);
        }

        .rca-doc-eyebrow {
            font-size: 11px;
            letter-spacing: .08em;
            text-transform: uppercase;
            color: var(--sidebar-text-dim);
            font-weight: 700;
            margin-bottom: 6px;
        }

        .rca-doc-title {
            font-family: var(--display);
            font-size: 23px;
            font-weight: 600;
        }

        .rca-doc-meta {
            font-family: var(--mono);
            font-size: 11.5px;
            color: var(--sidebar-text-dim);
            margin-top: 8px;
        }


        /* ---- Timeline vertikal "Chronology of Events" ---- */
        .vtimeline {
            position: relative;
            padding-left: 26px;
        }

        .vtimeline::before {
            content: '';
            position: absolute;
            left: 6px;
            top: 6px;
            bottom: 6px;
            width: 2px;
            background: var(--border);
        }

        .vt-item {
            position: relative;
            padding-bottom: 22px;
        }

        .vt-item:last-child {
            padding-bottom: 0;
        }

        .vt-dot {
            position: absolute;
            left: -26px;
            top: 2px;
            width: 13px;
            height: 13px;
            border-radius: 50%;
            background: var(--pearl-aqua);
            border: 2px solid #fff;
            box-shadow: 0 0 0 2px var(--pearl-aqua);
        }

        .vt-date {
            font-family: var(--mono);
            font-size: 12px;
            font-weight: 700;
            color: var(--accent-deep);
            margin-bottom: 3px;
        }

        .vt-text {
            font-size: 13px;
            color: var(--text-dim);
            line-height: 1.5;
            max-width: 620px;
        }


        /* ---- 4 kartu ringkasan (Downtime, Loss, dst) ---- */
        .summary-strip {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 12px;
            margin-bottom: 18px;
        }

        .summary-card {
            background: var(--deep-navy);
            border-radius: 12px;
            padding: 16px 18px;
            color: #fff;
            border-top: 3px solid var(--pearl-aqua);
        }

        .summary-card:nth-child(2) {
            border-top-color: var(--dusk-blue);
        }

        .summary-card:nth-child(3) {
            border-top-color: var(--critical);
        }

        .summary-card:nth-child(4) {
            border-top-color: var(--alice-blue);
        }

        .summary-label {
            font-size: 10.5px;
            text-transform: uppercase;
            letter-spacing: .05em;
            color: var(--sidebar-text-dim);
            font-weight: 700;
            margin-bottom: 8px;
        }

        .summary-value {
            font-family: var(--display);
            font-size: 22px;
            font-weight: 600;
        }

        .rc-two-col {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 16px;
            margin-bottom: 16px;
        }

        /* === composite anomaly score === */

        /* ============================================================
     11. COMPOSITE ANOMALY SCORE — panel yang gabungkan beberapa
         parameter sensor jadi satu skor
     ============================================================ */
        .composite-panel {
            margin-bottom: 16px;
        }

        .cparam-row {
            display: grid;
            grid-template-columns: 140px 1fr 90px 90px;
            align-items: center;
            gap: 14px;
            padding: 11px 0;
            border-bottom: 1px solid var(--border-soft);
        }

        .cparam-row:last-child {
            border-bottom: none;
        }

        .cparam-name {
            font-size: 12.5px;
            font-weight: 700;
        }

        .cparam-name .sub {
            display: block;
            font-size: 10.5px;
            color: var(--text-faint);
            font-weight: 500;
            margin-top: 1px;
        }

        .cparam-bar-wrap {
            height: 8px;
            background: var(--panel-3);
            border-radius: 5px;
            overflow: hidden;
            position: relative;
        }

        .cparam-bar {
            height: 100%;
            border-radius: 5px;
        }

        .cparam-thresh {
            position: absolute;
            top: -3px;
            bottom: -3px;
            width: 2px;
            background: var(--text-faint);
        }

        .cparam-val {
            font-family: var(--mono);
            font-size: 12.5px;
            font-weight: 700;
            text-align: right;
        }

        .cparam-status {
            text-align: right;
        }

        .composite-result {
            display: flex;
            align-items: center;
            gap: 18px;
            margin-top: 18px;
            padding-top: 18px;
            border-top: 2px dashed var(--border);
        }

        .composite-score-badge {
            width: 76px;
            height: 76px;
            border-radius: 50%;
            background: conic-gradient(var(--critical) 0% 79%, var(--panel-3) 79% 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
        }

        .composite-score-inner {
            width: 60px;
            height: 60px;
            border-radius: 50%;
            background: var(--panel);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }

        .composite-score-inner b {
            font-family: var(--mono);
            font-size: 17px;
        }

        .composite-score-inner span {
            font-size: 8.5px;
            color: var(--text-faint);
        }

        .composite-explain {
            font-size: 12.5px;
            color: var(--text-dim);
            line-height: 1.6;
        }

        /* === risk score breakdown === */

        /* ============================================================
     12. RISK SCORE BREAKDOWN — baris tabel yang bisa diklik untuk
         expand dan tampilkan rumus perhitungan skornya
     ============================================================ */
        .risk-cell {
            cursor: pointer;
            position: relative;
        }

        .risk-score-clickable {
            display: inline-flex;
            align-items: center;
            gap: 5px;
        }

        .risk-score-clickable svg {
            width: 12px;
            height: 12px;
            opacity: .6;
            transition: transform .15s;
        }

        .risk-breakdown-row {
            display: none;
        }

        .risk-breakdown-row.open {
            display: table-row;
        }

        .risk-breakdown-row td {
            background: var(--panel-2);
            padding: 16px 20px;
        }

        .rb-formula {
            display: flex;
            align-items: center;
            gap: 10px;
            flex-wrap: wrap;
            font-family: var(--mono);
            font-size: 12.5px;
        }

        .rb-term {
            background: var(--panel);
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 8px 12px;
            text-align: center;
        }

        .rb-term .n {
            font-weight: 700;
            font-size: 14px;
        }

        .rb-term .l {
            font-size: 9.5px;
            color: var(--text-faint);
            text-transform: uppercase;
            letter-spacing: .04em;
            margin-top: 2px;
        }

        .rb-op {
            color: var(--text-faint);
            font-size: 16px;
        }

        .rb-eq {
            color: var(--text-faint);
            font-size: 16px;
            margin: 0 4px;
        }

        .rb-result {
            background: var(--deep-navy);
            color: #fff;
            border-radius: 8px;
            padding: 8px 14px;
            text-align: center;
        }

        .rb-result .n {
            font-weight: 700;
            font-size: 15px;
        }

        .rb-result .l {
            font-size: 9.5px;
            color: var(--sidebar-text-dim);
            text-transform: uppercase;
            letter-spacing: .04em;
            margin-top: 2px;
        }

        /* ============================================================
     13. ENERGY & EMISSION MONITORING — KPI + forecast chart
       "monitor energy, production, emission" dan use case "Energy Forecasting"
     ============================================================ */
        .energy-kpi-row {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 14px;
            margin-bottom: 16px;
        }

        .forecast-legend {
            display: flex;
            gap: 18px;
            margin-bottom: 10px;
        }

        .forecast-band {
            opacity: .18;
        }


        /* ============================================================
     14. DATA SOURCE MAPPING 
     ============================================================ */
        .dsm-layout {
            display: grid;
            grid-template-columns: 1fr 80px 1fr;
            align-items: center;
            gap: 8px;
        }

        .dsm-col-label {
            font-size: 11px;
            text-transform: uppercase;
            letter-spacing: .06em;
            font-weight: 800;
            margin-bottom: 14px;
            text-align: center;
        }

        .dsm-before-item {
            display: flex;
            align-items: center;
            gap: 10px;
            background: var(--panel-2);
            border: 1px solid var(--border);
            border-radius: 10px;
            padding: 11px 14px;
            margin-bottom: 10px;
            font-size: 12.5px;
            font-weight: 600;
        }

        .dsm-before-item .dsm-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: var(--critical);
            flex-shrink: 0;
        }

        .dsm-before-item .dsm-sub {
            display: block;
            font-size: 10.5px;
            color: var(--text-faint);
            font-weight: 500;
            margin-top: 1px;
        }

        .dsm-arrow-col {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 6px;
            color: var(--text-faint);
        }

        .dsm-after-box {
            background: var(--deep-navy);
            border-radius: 14px;
            padding: 26px 20px;
            text-align: center;
            color: #fff;
            border: 2px solid var(--pearl-aqua);
        }

        .dsm-after-box .title {
            font-family: var(--display);
            font-size: 17px;
            font-weight: 600;
            margin-bottom: 6px;
        }

        .dsm-after-box .sub {
            font-size: 11.5px;
            color: var(--sidebar-text-dim);
            line-height: 1.5;
        }

        .dsm-after-tags {
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
            justify-content: center;
            margin-top: 14px;
        }

        .dsm-after-tags span {
            font-size: 10px;
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid var(--sidebar-border);
            padding: 3px 9px;
            border-radius: 20px;
            color: var(--sidebar-text);
        }

        /* ============================================================
     15. ACTION GUIDANCE 
     ============================================================ */
        .guidance-toggle {
            display: inline-flex;
            align-items: center;
            gap: 4px;
            font-size: 11.5px;
            font-weight: 700;
            color: var(--accent-deep);
            cursor: pointer;
        }

        .guidance-toggle svg {
            width: 12px;
            height: 12px;
            transition: transform .15s;
        }

        .guidance-row {
            display: none;
        }

        .guidance-row.open {
            display: table-row;
        }

        .guidance-row td {
            background: var(--panel-2);
            padding: 16px 20px;
        }

        .guidance-checklist {
            display: flex;
            flex-direction: column;
            gap: 9px;
        }

        .guidance-check-item {
            display: flex;
            align-items: flex-start;
            gap: 9px;
            font-size: 12.5px;
            color: var(--text-dim);
        }

        .guidance-check-item .box {
            width: 16px;
            height: 16px;
            border-radius: 5px;
            border: 2px solid var(--border);
            flex-shrink: 0;
            margin-top: 1px;
        }

        .guidance-check-item.done .box {
            background: var(--success);
            border-color: var(--success);
        }

        .guidance-check-item.done span {
            text-decoration: line-through;
            color: var(--text-faint);
        }


        /* ============================================================
     16. HUMAN OVERSIGHT / SIGN-OFF 
     ============================================================ */
        .oversight-bar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 14px;
            margin-top: 14px;
            padding-top: 14px;
            border-top: 1px dashed var(--border);
        }

        .oversight-note {
            font-size: 11.5px;
            color: var(--text-faint);
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .btn.reject {
            background: transparent;
            color: var(--critical);
            border: 1px solid var(--critical-soft);
        }

        .btn.approve {
            background: var(--success);
        }
